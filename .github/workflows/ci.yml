name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alchemy_test
          POSTGRES_USER: alchemy
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alchemy -d alchemy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pgsql, pdo_pgsql, mbstring, xml, curl, zip, bcmath, intl
          coverage: none

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        working-directory: backend
        run: |
          php -r '
            $xml = file_get_contents("phpunit.xml");
            $map = [
              "DB_HOST" => "127.0.0.1",
              "DB_DATABASE" => "alchemy_test",
              "DB_USERNAME" => "alchemy",
              "DB_PASSWORD" => "secret",
            ];
            foreach ($map as $k => $v) {
              $xml = preg_replace("/(<server name=\"" . $k . "\" value=\")[^\"]*(\"\/>)/", "${1}" . $v . "${2}", $xml);
            }
            file_put_contents("phpunit.xml", $xml);
          '
          vendor/bin/phpunit
