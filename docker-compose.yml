version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: alchemy_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - alchemy-net

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alchemy_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - alchemy-net

  postgres:
    image: postgres:16-alpine
    container_name: alchemy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alchemy_of_dreams
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - alchemy-net

  redis:
    image: redis:7-alpine
    container_name: alchemy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - alchemy-net

volumes:
  pgdata:

networks:
  alchemy-net:
    driver: bridge
